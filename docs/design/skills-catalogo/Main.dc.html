<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #3d29db; } a:hover { color: #4f3cfc; }
    * { box-sizing: border-box; }

    .mono {
      font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    /* Um único traço de cor no cartão inteiro, e mesmo assim só no hover.
       O resto é hairline e cinza — é isso que separa "minimalista" de
       "descolorido": a cor existe, mas é gasta com parcimônia. */
    .card {
      display: flex; flex-direction: column; min-width: 0;
      border: 1px solid #e6e9ed; border-radius: 10px; background: #ffffff; padding: 18px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .card:hover { border-color: #4f3cfc; box-shadow: 0 0 0 1px #4f3cfc; }

    .topo { display: flex; align-items: center; gap: 10px; }
    .glifo { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: none; color: #121730; }
    .card:hover .glifo { color: #3d29db; }

    .meta { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 10px; color: #98a2b3; letter-spacing: .04em; }
    .meta .nivel { text-transform: uppercase; letter-spacing: .1em; }
    .meta .ponto { width: 4px; height: 4px; border-radius: 50%; border: 1px solid #cfd4db; }
    .card.privado .meta .ponto { background: #4f3cfc; border-color: #4f3cfc; }
    .card.privado .meta .nivel { color: #3d29db; }

    .nome { margin: 18px 0 0; font-size: 15.5px; font-weight: 600; letter-spacing: -.02em; color: #121730; }
    .desc {
      margin: 7px 0 0; color: #667085; font-size: 12.5px; line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .pe { margin-top: auto; padding-top: 16px; }
    .pe .linha { height: 1px; background: #eef0f3; }
    .pe .campo { display: flex; align-items: baseline; gap: 8px; margin-top: 12px; font-size: 10.5px; }
    .pe .rot { flex: none; width: 46px; color: #cfd4db; letter-spacing: .06em; }
    .pe .val { min-width: 0; color: #667085; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pe .val b { color: #121730; font-weight: 500; }
    .pe .val .mais { color: #98a2b3; }
  </style>
</helmet>

<!-- A malha de pontos é a única textura da tela: 16px, quase invisível.
     Dá superfície sem virar gradiente. -->
<div style="width: 1210px; height: 700px; background: #fbfbfc; background-image: radial-gradient(#12173010 1px, transparent 1px); background-size: 16px 16px; padding: 28px; color: #121730">
  <div style="max-width: 1152px; margin: 0 auto">

    <div style="display: flex; align-items: flex-end; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid #e6e9ed">
      <div>
        <p class="mono" style="margin: 0 0 8px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #98a2b3">Núcleo de conhecimento</p>
        <h2 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.03em; line-height: 1.2; color: #121730">Catálogo de habilidades</h2>
        <p style="margin: 7px 0 0; font-size: 12.5px; line-height: 1.55; color: #667085; max-width: 480px">Oficiais evoluem centralmente; privados pertencem somente à organização.</p>
      </div>
      <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 7px; border-radius: 8px; background: #121730; color: #ffffff; padding: 9px 14px; font-size: 11.5px; font-weight: 500">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        Criar skill
      </span>
    </div>

    <div style="display: grid; grid-template-columns: repeat({{colunas}}, minmax(0, 1fr)); gap: 12px; margin-top: 20px; align-items: stretch">
      <sc-for list="{{skills}}" as="s" hint-placeholder-count="8">
        <div class="card {{s.cls}}">
          <div class="topo">
            <span class="glifo">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.glifo}}"></path></svg>
            </span>
            <span class="meta mono">
              <i class="ponto"></i>
              <span class="nivel">{{s.tier}}</span>
              <span>{{s.versao}}</span>
            </span>
          </div>

          <h3 class="nome">{{s.nome}}</h3>
          <p class="desc">{{s.descricao}}</p>

          <div class="pe">
            <div class="linha"></div>
            <div class="campo mono">
              <span class="rot">ativa</span>
              <span class="val">{{s.gatilhos}}</span>
            </div>
            <div class="campo mono">
              <span class="rot">usa</span>
              <span class="val"><b>{{s.tool}}</b> <span class="mais">{{s.maisTools}}</span></span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"colunas":{"editor":"enum","default":4,"options":[3,4,5],"section":"Grade"},"$preview":{"width":1210,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    // Nomes, descrições, gatilhos e ferramentas saem de
    // packages/intelligence/skills/*/skill.json. O único inventado é
    // "Pós-venda", que existe aqui só para o nível Privado aparecer.
    const brutos = [
      {
        nome: "Recepção", tier: "Núcleo", v: 1,
        descricao: "Recebe novos clientes, entende a intenção e encaminha para a habilidade adequada.",
        gatilhos: ["oi", "olá", "bom dia"],
        tools: ["knowledge.search", "crm.contact.read", "crm.contact.upsert", "crm.tag.apply"],
        glifo: "M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3",
      },
      {
        nome: "Pré-qualificação", tier: "Núcleo", v: 1,
        descricao: "Coleta dados essenciais e registra a qualificação no CRM.",
        gatilhos: ["interesse", "quero saber"],
        tools: ["crm.contact.upsert", "crm.tag.apply", "crm.deal.qualify"],
        glifo: "M22 3H2l8 9.46V19l4 2v-8.54L22 3z",
      },
      {
        nome: "Vendas", tier: "Núcleo", v: 1,
        descricao: "Entende o interesse, apresenta a oferta autorizada e conduz o próximo passo.",
        gatilhos: ["preço", "valor", "contratar"],
        tools: ["knowledge.search", "crm.contact.read", "crm.contact.upsert", "crm.tag.apply"],
        glifo: "M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82zM7.5 7.5h.01",
      },
      {
        nome: "Suporte", tier: "Núcleo", v: 1,
        descricao: "Orienta com base no conteúdo publicado e transfere casos não resolvidos.",
        gatilhos: ["ajuda", "erro", "problema"],
        tools: ["knowledge.search", "crm.contact.read", "conversation.handoff"],
        glifo: "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M4.93 4.93l4.24 4.24M14.83 14.83l4.24 4.24M14.83 9.17l4.24-4.24M4.93 19.07l4.24-4.24",
      },
      {
        nome: "Solicitação de agenda", tier: "Núcleo", v: 1,
        descricao: "Prepara pedidos de horário de clientes e os submete à aprovação da equipe.",
        gatilhos: ["agendar", "marcar"],
        tools: ["calendar.availability", "calendar.request.prepare", "calendar.request.submit"],
        glifo: "M8 2v4M16 2v4M3 10h18M21 13V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8M16 19h6M19 16v6",
      },
      {
        nome: "Agenda", tier: "Núcleo", v: 1,
        descricao: "Consulta disponibilidade e cria compromissos internos com confirmação.",
        gatilhos: ["agenda", "reunião", "horário"],
        tools: ["calendar.read", "calendar.availability", "calendar.prepare", "calendar.confirm"],
        glifo: "M8 2v4M16 2v4M3 10h18M21 14V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7M16 20l2 2 4-4",
      },
      {
        nome: "Tarefas", tier: "Núcleo", v: 1,
        descricao: "Consulta e cria tarefas internas com atribuição e confirmação.",
        gatilhos: ["tarefa", "pendência"],
        tools: ["task.read", "task.prepare", "task.confirm", "knowledge.search"],
        glifo: "M21 10.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11M9 11l3 3L22 4",
      },
      {
        nome: "Pós-venda", tier: "Privado", v: 2,
        descricao: "Acompanha quem já comprou, confirma a entrega e registra a satisfação.",
        gatilhos: ["entrega", "recebi", "avaliar"],
        tools: ["crm.contact.read", "crm.tag.apply", "conversation.handoff"],
        glifo: "M16.5 9.4L7.5 4.21M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16zM3.27 6.96L12 12.01l8.73-5.05M12 22.08V12",
      },
    ];

    return {
      colunas: this.props.colunas ?? 4,
      skills: brutos.map((s) => ({
        ...s,
        cls: s.tier === "Privado" ? "privado" : "",
        versao: `v${s.v}`,
        gatilhos: s.gatilhos.join("  "),
        tool: s.tools[0],
        maisTools: s.tools.length > 1 ? `+${s.tools.length - 1}` : "",
      })),
    };
  }
}
</script>
</body>
</html>
