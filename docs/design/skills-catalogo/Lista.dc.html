<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #3d29db; } a:hover { color: #4f3cfc; }
    * { box-sizing: border-box; }

    .mono {
      font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .tabela { border: 1px solid #e6e9ed; border-radius: 10px; background: #ffffff; overflow: hidden; }

    .linha {
      display: grid;
      grid-template-columns: 28px 190px minmax(0, 1fr) 190px 200px 96px;
      gap: 18px; align-items: center;
      padding: 0 18px; height: 54px;
      border-bottom: 1px solid #eef0f3;
    }
    .linha:last-child { border-bottom: 0; }
    .linha.cabeca {
      height: 38px; background: #fbfbfc; border-bottom: 1px solid #e6e9ed;
      font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: #98a2b3;
    }
    .linha.item { transition: background-color .12s ease; }
    .linha.item:hover { background: #fbfbfc; }

    .glifo { display: flex; align-items: center; justify-content: center; color: #667085; }
    .linha.item:hover .glifo { color: #3d29db; }

    .nome { font-size: 13.5px; font-weight: 600; letter-spacing: -.015em; color: #121730; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .desc { font-size: 12px; line-height: 1.4; color: #667085; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cel { font-size: 10.5px; color: #667085; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cel b { color: #121730; font-weight: 500; }
    .cel .mais { color: #cfd4db; }

    .nivel { display: flex; align-items: center; justify-content: flex-end; gap: 7px; font-size: 10px; letter-spacing: .08em; color: #98a2b3; }
    .nivel i { width: 4px; height: 4px; border-radius: 50%; border: 1px solid #cfd4db; flex: none; }
    .linha.priv .nivel { color: #3d29db; }
    .linha.priv .nivel i { background: #4f3cfc; border-color: #4f3cfc; }
  </style>
</helmet>

<div style="width: 1210px; height: 700px; background: #fbfbfc; background-image: radial-gradient(#12173010 1px, transparent 1px); background-size: 16px 16px; padding: 28px; color: #121730">
  <div style="max-width: 1152px; margin: 0 auto">

    <div style="display: flex; align-items: flex-end; gap: 16px; padding-bottom: 20px">
      <div>
        <p class="mono" style="margin: 0 0 8px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #98a2b3">Núcleo de conhecimento</p>
        <h2 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.03em; line-height: 1.2; color: #121730">Catálogo de habilidades</h2>
        <p style="margin: 7px 0 0; font-size: 12.5px; line-height: 1.55; color: #667085; max-width: 480px">Oficiais evoluem centralmente; privados pertencem somente à organização.</p>
      </div>
      <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 7px; border-radius: 8px; background: #121730; color: #ffffff; padding: 9px 14px; font-size: 11.5px; font-weight: 500">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        Criar skill
      </span>
    </div>

    <div class="tabela">
      <div class="linha cabeca mono">
        <span></span>
        <span>Habilidade</span>
        <span>O que faz</span>
        <span>Ativa com</span>
        <span>Ferramentas</span>
        <span style="text-align: right">Nível</span>
      </div>

      <sc-for list="{{skills}}" as="s" hint-placeholder-count="8">
        <div class="linha item {{s.cls}}">
          <span class="glifo">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.glifo}}"></path></svg>
          </span>
          <span class="nome">{{s.nome}}</span>
          <span class="desc">{{s.descricao}}</span>
          <span class="cel mono">{{s.gatilhos}}</span>
          <span class="cel mono"><b>{{s.tool}}</b> <span class="mais">{{s.maisTools}}</span></span>
          <span class="nivel mono"><i></i>{{s.tier}} {{s.versao}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

</script>
</body>
</html>
