name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  portal:
    runs-on: ubuntu-latest
    # Só o que o servidor Node precisa para subir. As variáveis `VITE_` e
    # `PUBLIC_ORIGIN` foram removidas de propósito: variável de processo vence
    # sobre `apps/emyleads/.env.test`, que é versionado justamente para dar
    # ambiente aos testes, e sobre o padrão de `src/server.mjs`. Repor aqui
    # quebra `supabaseClient.test.js` e `server.test.mjs`.
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm test
      - run: npm run build:extension
